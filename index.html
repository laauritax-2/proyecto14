
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Calculadora de edad exacta en años, meses y días.">
    <meta name="author" content="Proyecto 14">

    <title>Calculadora de Edad</title>

    <!-- Conectamos los estilos CSS -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- Contenedor principal -->
    <main class="pagina">

        <!-- Tarjeta de la calculadora -->
        <section class="calculadora">

            <!-- Encabezado -->
            <header class="encabezado">
                <h1>¿Cuántos años tienes?</h1>

                <p>
                    Ingresa tu fecha de nacimiento
                    y descubre tu edad exacta.
                </p>
            </header>

            <!-- Formulario -->
            <form id="formulario-edad">

                <label for="fecha-nacimiento">
                    Fecha de nacimiento
                </label>

                <!-- Flatpickr personalizará este campo -->
                <input
                    type="text"
                    id="fecha-nacimiento"
                    name="fecha-nacimiento"
                    placeholder="Selecciona tu fecha"
                    autocomplete="off"
                    aria-describedby="ayuda-fecha error-fecha"
                >

                <small id="ayuda-fecha">
                    Selecciona una fecha en el calendario.
                </small>

                <!-- Mensajes de error -->
                <small
                    id="error-fecha"
                    class="mensaje-error"
                    aria-live="polite">
                </small>

                <!-- Botón para calcular -->
                <button type="submit">
                    Calcular mi edad
                </button>

            </form>

            <!-- Sección de resultados -->
            <section
                id="resultado"
                class="resultado"
                aria-live="polite"
                hidden>

                <h2>Tu edad exacta es:</h2>

                <div class="edad">

                    <div class="dato">
                        <strong id="anios">0</strong>
                        <span>Años</span>
                    </div>

                    <div class="dato">
                        <strong id="meses">0</strong>
                        <span>Meses</span>
                    </div>

                    <div class="dato">
                        <strong id="dias">0</strong>
                        <span>Días</span>
                    </div>

                </div>

                <p id="mensaje-edad"></p>

            </section>

            <!-- Nota informativa -->
            <footer class="pie">
                <p>
                    El cálculo utiliza la fecha actual
                    de tu dispositivo.
                </p>
            </footer>

        </section>

    </main>

    <!-- Conectamos JavaScript mediante módulos de Vite -->
    <script type="module" src="/script.js"></script>

</body>
</html>

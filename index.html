<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de edad</title>
</head>
<body>
    <!-- Contenedor general: centra la calculadora en la pantalla. -->
    <main class="pagina">
        <!-- Tarjeta principal con el formulario y el resultado. -->
        <section class="calculadora">
            <div class="encabezado">
                <span class="etiqueta">CALCULADORA PERSONAL</span>
                <h1>¿Cuántos años tienes?</h1>
                <p>Ingresa tu fecha de nacimiento y descubre tu edad exacta.</p>
            </div>

            <!-- El formulario recoge la fecha y permite calcular la edad. -->
            <!-- Formulario que recibe la fecha de nacimiento. -->
            <form id="formulario-edad">
                <!-- for conecta la etiqueta con el input que tiene el mismo id. -->
                <label for="fecha-nacimiento">Fecha de nacimiento</label>

                <!-- Es text y no date para usar Flatpickr en lugar del calendario del navegador. -->
                <!-- Campo de texto: Flatpickr lo convierte en un calendario personalizado. -->
                <input
                    type="text"
                    id="fecha-nacimiento"
                    name="fecha-nacimiento"
                    placeholder="Selecciona tu fecha"
                    autocomplete="off"
                    required
                    aria-describedby="ayuda-fecha error-fecha"
                >

                <small id="ayuda-fecha">Selecciona una fecha en el calendario.</small>
                <!-- Aquí JavaScript mostrará los errores de fecha. -->
                <small id="error-fecha" class="mensaje-error" aria-live="polite"></small>

                <!-- Al pulsar, se envía el formulario para calcular la edad. -->
                <button type="submit">Calcular mi edad</button>
            </form>

            <!-- El resultado aparece aquí sin cambiar de página. -->
            <!-- Esta sección comienza oculta y JavaScript la mostrará al calcular. -->
            <section id="resultado" class="resultado" aria-live="polite" hidden>
                <h2>Tu edad exacta es:</h2>
                <!-- Espacios separados para los años, meses y días. -->
                <div class="edad">
                    <div class="dato">
                        <strong id="anios">0</strong>
                        <span>años</span>
                    </div>
                    <div class="dato">
                        <strong id="meses">0</strong>
                        <span>meses</span>
                    </div>
                    <div class="dato">
                        <strong id="dias">0</strong>
                        <span>días</span>
                    </div>
                </div>
                <p id="mensaje-edad"></p>
            </section>

            <p class="nota">El cálculo se realiza con la fecha actual de tu dispositivo.</p>
        </section>
    </main>

    <!-- Vite permite utilizar los paquetes instalados con npm. -->
    <!-- type=module permite importar Luxon y Flatpickr desde script.js. -->
    <script type="module" src="/script.js"></script>
</body>
</html>
